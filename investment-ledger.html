      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:calc(100px + env(safe-area-inset-bottom));
    transition:background 0.3s, color 0.3s;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; }

  header{
    padding:max(28px, env(safe-area-inset-top) + 16px) max(20px, env(safe-area-inset-right) + 20px) 18px max(20px, env(safe-area-inset-left) + 20px);
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .title-block h1{
    margin:0;
    font-size:26px;
    font-weight:600;
    letter-spacing:0.3px;
    color:var(--forest);
  }
  .title-block p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .header-row{ display:flex; align-items:center; gap:12px; }
  .icon-btn{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--card);
    box-shadow:0 2px 8px var(--shadow);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    flex-shrink:0;
    cursor:pointer;
    border:1px solid var(--paper-line);
    color:var(--ink);
  }

  .stats{ display:flex; gap:12px; padding:0 20px 20px; }
  .stat-card{
    flex:1;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:0 2px 6px var(--shadow);
  }
  .stat-card .label{ font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .stat-card .value{ font-size:20px; font-weight:600; color:var(--forest); }
  .stat-card .value.brass{ color:var(--brass); }
  .stat-card .delta{ font-size:11px; margin-top:2px; font-weight:600; }
  .stat-card .delta.up{ color:var(--sage); }
  .stat-card .delta.down{ color:var(--terracotta); }
  .stat-card .delta.flat{ color:var(--ink-soft); }

  .chart-section{
    margin:0 20px 22px;
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:18px;
    padding:20px;
    box-shadow:0 2px 8px var(--shadow);
    display:flex;
    align-items:center;
    gap:16px;
    overflow:hidden;
  }
  .donut-wrap{ position:relative; width:120px; height:120px; flex-shrink:0; }
  .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut-center .amt{ font-size:14px; font-weight:600; color:var(--ink); }
  .donut-center .lbl{ font-size:9px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; }

  .legend{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:13px; padding:2px 0; min-width:0; }
  .legend-dot{ width:10px;height:10px;border-radius:50%; flex-shrink:0; }
  .legend-name{ color:var(--ink); font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-pct{ font-size:14px; font-weight:600; color:var(--ink); flex-shrink:0; }
  .empty-note{ font-size:13px; color:var(--ink-soft); }

  .section-heading{
    padding:0 20px 8px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:center;
  }
  .view-all{ font-size:12px; color:var(--forest); font-weight:600; cursor:pointer; }

  .entry{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:12px 14px;
    margin:0 20px 8px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 1px 4px var(--shadow);
  }
  .entry-icon{ width:36px;height:36px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:16px; flex-shrink:0; }
  .entry-info{ flex:1; min-width:0; }
  .entry-cat{ font-size:14px; font-weight:600; }
  .entry-note{ font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-date{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .entry-amt{ font-size:15px; font-weight:600; color:var(--forest); white-space:nowrap; }

  .no-entries{
    margin:0 20px;
    text-align:center; color:var(--ink-soft); font-size:13px; padding:24px 10px;
    background:var(--card); border:1px dashed var(--paper-line); border-radius:14px;
  }

  .fab{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--forest);
    color:var(--paper);
    border:none;
    border-radius:30px;
    padding:14px 28px;
    font-size:15px;
    font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    cursor:pointer;
    font-family:inherit;
  }

  .footer-actions{ display:flex; justify-content:center; gap:18px; padding:10px 20px 4px; }
  .footer-actions button{
    background:none; border:none; color:var(--ink-soft); font-size:12px;
    text-decoration:underline; cursor:pointer; font-family:inherit;
  }
  input[type=file]{ display:none; }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(20,20,15,0.45);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--paper);
    width:100%; max-width:480px;
    max-height:85vh; overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 20px rgba(0,0,0,0.2);
    animation:slideUp 0.25s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal h3{ margin:0 0 16px; color:var(--forest); font-size:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:10px;
    border:1px solid var(--paper-line); background:var(--card); color:var(--ink);
    font-size:16px; line-height:1.3; font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;
    -webkit-appearance:none; appearance:none; display:block;
  }
  .field select{ -webkit-appearance:menulist; appearance:auto; }
  .field input:focus, .field select:focus{ outline:2px solid var(--sage); }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .cat-add-row{ display:flex; gap:8px; }
  .cat-add-row input{
    flex:1; padding:11px 12px; border-radius:10px;
    border:1px solid var(--paper-line); background:var(--card); color:var(--ink);
    font-size:16px; line-height:1.3; font-family:'Work Sans','Helvetica Neue',Arial,sans-serif;
    -webkit-appearance:none; appearance:none;
  }
  .modal-btns{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--forest); color:var(--paper); }
  .btn-secondary{ background:var(--card); color:var(--ink); border:1px solid var(--paper-line); }

  .month-group{ margin:0 20px 14px; background:var(--card); border:1px solid var(--paper-line); border-radius:14px; overflow:hidden; }
  .month-header{ font-size:13px; font-weight:600; color:var(--forest); padding:13px 14px; display:flex; justify-content:space-between; cursor:pointer; }
  .month-total{ color:var(--ink-soft); font-weight:400; }
  .month-body{ display:none; padding:0 12px 12px; flex-direction:column; gap:8px; }
  .month-body.open{ display:flex; }
  .month-body .entry{ margin:0; }

  .toast{
    position:fixed; bottom:calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; font-size:.85rem;
    display:flex; gap:14px; align-items:center; z-index:60; box-shadow:0 4px 16px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; pointer-events:auto; }
  .toast button{ background:none;border:none;color:var(--brass);font-weight:600;cursor:pointer;font-family:inherit; }
  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Invest Ledger</h1>
    <p>Track what's gone where</p>
  </div>
  <div class="header-row">
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
    <button class="icon-btn" id="menuBtn" title="Backup">⋯</button>
  </div>
</header>

<div class="stats">
  <div class="stat-card">
    <div class="label">Total invested</div>
    <div class="value" id="totalAmount">₹0</div>
  </div>
  <div class="stat-card">
    <div class="label">This month</div>
    <div class="value brass" id="monthAmount">₹0</div>
    <div class="delta flat" id="monthDelta"></div>
  </div>
</div>

<div class="chart-section" id="chartCard">
  <div class="donut-wrap" id="donutWrap"></div>
  <div class="legend" id="legend"></div>
</div>

<div class="section-heading">
  <span>Recent</span>
  <span class="view-all" id="viewAllBtn" style="display:none;">Full history →</span>
</div>
<div id="recentList"></div>

<button class="fab" id="addBtn">＋ Add investment</button>
<input type="file" id="importFile" accept="application/json">

<!-- Add entry modal -->
<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <h3>Add investment</h3>
    <form id="entryForm">
      <div class="row2">
        <div class="field">
          <label for="f-date">Date</label>
          <input type="date" id="f-date" required>
        </div>
        <div class="field">
          <label for="f-amount">Amount (₹)</label>
          <input type="number" id="f-amount" inputmode="decimal" step="0.01" min="0" placeholder="0" required>
        </div>
      </div>
      <div class="field">
        <label for="f-category">Category</label>
        <select id="f-category" required></select>
      </div>
      <div class="field" id="newCatField" style="display:none;">
        <label for="f-newcat">New category name</label>
        <div class="cat-add-row">
          <input type="text" id="f-newcat" placeholder="e.g. Gold ETF">
          <button type="button" class="btn btn-secondary" id="confirmNewCat" style="flex:0 0 auto;padding:11px 14px;">Add</button>
        </div>
      </div>
      <div class="field">
        <label for="f-note">Note (optional)</label>
        <input type="text" id="f-note" placeholder="e.g. SIP, lump sum, folio no.">
      </div>
      <div class="modal-btns">
        <button type="button" class="btn btn-secondary" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn btn-primary">Save entry</button>
      </div>
    </form>
  </div>
</div>

<!-- History overlay -->
<div class="modal-overlay" id="historyOverlay">
  <div class="modal">
    <h3>Full history</h3>
    <div id="monthGroupsInner"></div>
    <div class="modal-btns"><button class="btn btn-secondary" id="closeHistory">Close</button></div>
  </div>
</div>

<!-- Backup/menu overlay -->
<div class="modal-overlay" id="menuOverlay">
  <div class="modal">
    <h3>Data</h3>
    <div class="modal-btns" style="flex-direction:column;">
      <button class="btn btn-secondary" id="exportBtn">Export backup</button>
      <button class="btn btn-secondary" id="importBtn">Import backup</button>
      <button class="btn btn-secondary" id="manageCatBtn">Manage categories</button>
    </div>
    <div class="modal-btns"><button class="btn btn-secondary" id="closeMenu">Close</button></div>
  </div>
</div>

<!-- Manage categories overlay -->
<div class="modal-overlay" id="catOverlay">
  <div class="modal">
    <h3>Categories</h3>
    <div id="catList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;"></div>
    <div class="cat-add-row" style="margin-bottom:14px;">
      <input type="text" id="inCatName" placeholder="New category name">
      <button type="button" class="btn btn-secondary" id="addCatBtn" style="flex:0 0 auto;padding:11px 14px;">Add</button>
    </div>
    <div class="modal-btns"><button class="btn btn-secondary" id="closeCat">Close</button></div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Undo</button>
</div>

<script>
(function(){
  const LS_ENTRIES = 'ledger_investment_entries_v1';
  const LS_CATS = 'ledger_investment_categories_v1';
  const LS_THEME = 'ledger_investment_theme_v1';

  const DEFAULT_CATS = [
    { name:'Zerodha', icon:'📈', color:'#5E7A8C' },
    { name:'Mutual Fund', icon:'🌱', color:'#7A9B76' },
    { name:'US Stock', icon:'🌎', color:'#B5533C' },
    { name:'Bond', icon:'📜', color:'#C9A227' }
  ];
  const PALETTE = ['#5E7A8C','#7A9B76','#B5533C','#C9A227','#8A6FAE','#4F8F7A','#B0763F','#A15A8A'];

  let entries = JSON.parse(localStorage.getItem(LS_ENTRIES) || '[]');
  let categories = JSON.parse(localStorage.getItem(LS_CATS) || 'null') || DEFAULT_CATS.slice();
  let pendingDelete = null;
  let undoTimer = null;

  function save(){
    localStorage.setItem(LS_ENTRIES, JSON.stringify(entries));
    localStorage.setItem(LS_CATS, JSON.stringify(categories));
  }
  function fmt(n){ return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:0}); }
  function catInfo(name){
    return categories.find(c=>c.name===name) || { name, icon:'💰', color: PALETTE[categories.length % PALETTE.length] };
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem(LS_THEME, t);
  }
  applyTheme(localStorage.getItem(LS_THEME) || 'light');
  themeToggle.addEventListener('click', ()=>{
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  function openOverlay(id){ document.getElementById(id).classList.add('show'); }
  function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

  const catSelect = document.getElementById('f-category');
  const newCatField = document.getElementById('newCatField');
  function renderCatSelect(){
    catSelect.innerHTML = '';
    categories.forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.icon + ' ' + c.name;
      catSelect.appendChild(opt);
    });
    const addOpt = document.createElement('option');
    addOpt.value = '__add__';
    addOpt.textContent = '＋ Add new category';
    catSelect.appendChild(addOpt);
  }
  catSelect.addEventListener('change', ()=>{
    newCatField.style.display = catSelect.value === '__add__' ? 'block' : 'none';
  });
  document.getElementById('confirmNewCat').addEventListener('click', ()=>{
    const val = document.getElementById('f-newcat').value.trim();
    if(!val) return;
    if(!categories.find(c=>c.name.toLowerCase()===val.toLowerCase())){
      categories.push({name:val, icon:'💰', color: PALETTE[categories.length % PALETTE.length]});
      save();
    }
    renderCatSelect();
    catSelect.value = val;
    newCatField.style.display = 'none';
    document.getElementById('f-newcat').value = '';
  });

  document.getElementById('addBtn').addEventListener('click', ()=>{
    document.getElementById('f-date').valueAsDate = new Date();
    openOverlay('addOverlay');
  });
  document.getElementById('cancelAdd').addEventListener('click', ()=> closeOverlay('addOverlay'));

  document.getElementById('entryForm').addEventListener('submit', e=>{
    e.preventDefault();
    const date = document.getElementById('f-date').value;
    const amount = parseFloat(document.getElementById('f-amount').value);
    let category = catSelect.value;
    const note = document.getElementById('f-note').value.trim();
    if(category === '__add__'){
      const val = document.getElementById('f-newcat').value.trim();
      if(!val) return;
      if(!categories.find(c=>c.name.toLowerCase()===val.toLowerCase())){
        categories.push({name:val, icon:'💰', color: PALETTE[categories.length % PALETTE.length]});
      }
      category = val;
    }
    if(!date || !amount || !category) return;

    const existing = entries.find(e=>e.category.toLowerCase()===category.toLowerCase());
    if(existing){
      existing.amount += amount;
      if(date >= existing.date) existing.date = date;
      if(note){
        existing.note = existing.note ? existing.note + ' · ' + note : note;
      }
    } else {
      entries.push({id:uid(), date, amount, category, note});
    }
    save();
    e.target.reset();
    renderCatSelect();
    newCatField.style.display = 'none';
    closeOverlay('addOverlay');
    renderAll();
  });

  function renderTotal(){
    const total = entries.reduce((s,e)=>s+e.amount,0);
    document.getElementById('totalAmount').textContent = fmt(total);

    const now = new Date();
    const thisKey = now.toISOString().slice(0,7);
    const lastDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const lastKey = lastDate.toISOString().slice(0,7);
    const thisMonthTotal = entries.filter(e=>e.date.slice(0,7)===thisKey).reduce((s,e)=>s+e.amount,0);
    const lastMonthTotal = entries.filter(e=>e.date.slice(0,7)===lastKey).reduce((s,e)=>s+e.amount,0);

    document.getElementById('monthAmount').textContent = fmt(thisMonthTotal);
    const deltaEl = document.getElementById('monthDelta');
    if(lastMonthTotal === 0){
      deltaEl.textContent = thisMonthTotal > 0 ? 'New this month' : '';
      deltaEl.className = 'delta flat';
    } else {
      const pct = Math.round(((thisMonthTotal - lastMonthTotal) / lastMonthTotal) * 100);
      if(pct === 0){
        deltaEl.textContent = 'Same as last month';
        deltaEl.className = 'delta flat';
      } else if(pct > 0){
        deltaEl.textContent = '↑ ' + pct + '% vs last month';
        deltaEl.className = 'delta up';
      } else {
        deltaEl.textContent = '↓ ' + Math.abs(pct) + '% vs last month';
        deltaEl.className = 'delta down';
      }
    }
  }

  function renderChart(){
    const wrap = document.getElementById('donutWrap');
    const legend = document.getElementById('legend');
    const totals = {};
    entries.forEach(e=>{ totals[e.category] = (totals[e.category]||0) + e.amount; });
    const cats = Object.keys(totals);
    if(cats.length === 0){
      wrap.innerHTML = '';
      legend.innerHTML = '<div class="empty-note">Add your first investment to see the breakdown here.</div>';
      return;
    }
    const grand = cats.reduce((s,c)=>s+totals[c],0);
    let cumulative = 0;
    const R = 42, C = 60, STROKE = 16;
    const circumference = 2*Math.PI*R;
    let segs = '';
    const sorted = cats.slice().sort((a,b)=>totals[b]-totals[a]);
    sorted.forEach(c=>{
      const frac = totals[c]/grand;
      const dash = frac * circumference;
      const info = catInfo(c);
      segs += `<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="${info.color}" stroke-width="${STROKE}"
        stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-cumulative}" transform="rotate(-90 ${C} ${C})"/>`;
      cumulative += dash;
    });
    wrap.innerHTML = `<svg width="120" height="120" viewBox="0 0 120 120">${segs}
      <circle cx="${C}" cy="${C}" r="${R-STROKE/2-2}" fill="var(--card)"/>
      </svg>
      <div class="donut-center"><div class="amt mono">${fmt(grand)}</div><div class="lbl">Total</div></div>`;
    legend.innerHTML = sorted.map(c=>{
      const info = catInfo(c);
      const pct = Math.round((totals[c]/grand)*100);
      return `<div class="legend-item">
        <span class="legend-dot" style="background:${info.color}"></span>
        <span class="legend-name">${info.icon} ${c}</span>
        <span class="legend-pct mono">${pct}%</span>
      </div>`;
    }).join('');
  }

  function entryRowHTML(e){
    const info = catInfo(e.category);
    const dateStr = new Date(e.date+'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short'});
    return `<div class="entry" data-id="${e.id}">
      <div class="entry-icon" style="background:${info.color}22;color:${info.color}">${info.icon}</div>
      <div class="entry-info">
        <div class="entry-cat">${e.category}</div>
        <div class="entry-date">${dateStr}${e.note ? ' · <span class="entry-note">'+escapeHtml(e.note)+'</span>' : ''}</div>
      </div>
      <div class="entry-amt mono">${fmt(e.amount)}</div>
    </div>`;
  }

  function renderRecent(){
    const list = document.getElementById('recentList');
    const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    const recent = sorted.slice(0,5);
    if(recent.length === 0){
      list.innerHTML = '<div class="no-entries">No investments logged yet. Tap "Add investment" to start.</div>';
      document.getElementById('viewAllBtn').style.display = 'none';
      return;
    }
    list.innerHTML = recent.map(e=>entryRowHTML(e)).join('');
    attachRowHandlers(list);
    document.getElementById('viewAllBtn').style.display = entries.length > 5 ? 'inline' : 'none';
  }

  function attachRowHandlers(container){
    container.querySelectorAll('.entry').forEach(row=>{
      let startX = 0, delta = 0;
      row.addEventListener('touchstart', ev=>{ startX = ev.touches[0].clientX; }, {passive:true});
      row.addEventListener('touchmove', ev=>{ delta = ev.touches[0].clientX - startX; }, {passive:true});
      row.addEventListener('touchend', ()=>{
        if(delta < -50) confirmDelete(row.getAttribute('data-id'));
        delta = 0;
      });
      row.addEventListener('dblclick', ()=> confirmDelete(row.getAttribute('data-id')));
    });
  }

  function confirmDelete(id){
    const idx = entries.findIndex(e=>e.id===id);
    if(idx === -1) return;
    pendingDelete = entries[idx];
    entries.splice(idx,1);
    save();
    renderAll();
    showToast('Entry deleted');
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(()=>{ toast.classList.remove('show'); pendingDelete = null; }, 4000);
  }
  document.getElementById('toastUndo').addEventListener('click', ()=>{
    if(pendingDelete){ entries.push(pendingDelete); pendingDelete = null; save(); renderAll(); }
    document.getElementById('toast').classList.remove('show');
    clearTimeout(undoTimer);
  });

  function renderMonthGroups(){
    const container = document.getElementById('monthGroupsInner');
    if(entries.length === 0){
      container.innerHTML = '<div class="no-entries" style="margin:0;">No investments logged yet.</div>';
      return;
    }
    const groups = {};
    entries.forEach(e=>{
      const key = e.date.slice(0,7);
      groups[key] = groups[key] || [];
      groups[key].push(e);
    });
    const keys = Object.keys(groups).sort().reverse();
    container.innerHTML = keys.map(key=>{
      const list = groups[key].sort((a,b)=> b.date.localeCompare(a.date));
      const total = list.reduce((s,e)=>s+e.amount,0);
      const label = new Date(key+'-01T00:00:00').toLocaleDateString('en-IN', {month:'long', year:'numeric'});
      return `<div class="month-group">
        <div class="month-header" data-key="${key}">
          <span>${label}</span>
          <span class="month-total mono">${fmt(total)}</span>
        </div>
        <div class="month-body" id="mb-${key}">${list.map(e=>entryRowHTML(e)).join('')}</div>
      </div>`;
    }).join('');
    container.querySelectorAll('.month-header').forEach(h=>{
      h.addEventListener('click', ()=>{
        document.getElementById('mb-' + h.getAttribute('data-key')).classList.toggle('open');
      });
    });
    attachRowHandlers(container);
  }

  function renderCatManage(){
    const list = document.getElementById('catList');
    list.innerHTML = categories.map((c,i)=>{
      const used = entries.some(e=>e.category===c.name);
      return `<div class="entry" style="margin:0;">
        <div class="entry-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
        <div class="entry-info"><div class="entry-cat">${c.name}</div></div>
        ${used ? '<span style="font-size:.72rem;color:var(--ink-soft)">in use</span>' : `<button class="icon-btn" data-del="${i}" style="width:28px;height:28px;font-size:.75rem;">✕</button>`}
      </div>`;
    }).join('');
    list.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        categories.splice(parseInt(btn.getAttribute('data-del')),1);
        save();
        renderCatManage();
        renderCatSelect();
      });
    });
  }
  document.getElementById('addCatBtn').addEventListener('click', ()=>{
    const val = document.getElementById('inCatName').value.trim();
    if(!val) return;
    if(!categories.find(c=>c.name.toLowerCase()===val.toLowerCase())){
      categories.push({name:val, icon:'💰', color: PALETTE[categories.length % PALETTE.length]});
      save();
    }
    document.getElementById('inCatName').value = '';
    renderCatManage();
    renderCatSelect();
  });

  function renderAll(){
    renderTotal();
    renderChart();
    renderRecent();
  }

  document.getElementById('viewAllBtn').addEventListener('click', ()=>{ renderMonthGroups(); openOverlay('historyOverlay'); });
  document.getElementById('closeHistory').addEventListener('click', ()=> closeOverlay('historyOverlay'));
  document.getElementById('historyOverlay').addEventListener('click', e=>{ if(e.target.id==='historyOverlay') closeOverlay('historyOverlay'); });

  document.getElementById('menuBtn').addEventListener('click', ()=> openOverlay('menuOverlay'));
  document.getElementById('closeMenu').addEventListener('click', ()=> closeOverlay('menuOverlay'));
  document.getElementById('menuOverlay').addEventListener('click', e=>{ if(e.target.id==='menuOverlay') closeOverlay('menuOverlay'); });

  document.getElementById('manageCatBtn').addEventListener('click', ()=>{ closeOverlay('menuOverlay'); renderCatManage(); openOverlay('catOverlay'); });
  document.getElementById('closeCat').addEventListener('click', ()=> closeOverlay('catOverlay'));
  document.getElementById('catOverlay').addEventListener('click', e=>{ if(e.target.id==='catOverlay') closeOverlay('catOverlay'); });

  document.getElementById('addOverlay').addEventListener('click', e=>{ if(e.target.id==='addOverlay') closeOverlay('addOverlay'); });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const data = {entries, categories, exportedAt:new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'investment-ledger-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', ev=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(Array.isArray(data.entries)) entries = data.entries;
        if(Array.isArray(data.categories)) categories = data.categories;
        save();
        renderCatSelect();
        renderAll();
        showToast('Backup imported');
      }catch(err){
        showToast('Import failed — invalid file');
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  });

  // Keep modals and focused fields visible above the iOS keyboard
  if (window.visualViewport) {
    const vp = window.visualViewport;
    function adjustModals(){
      const h = Math.round(vp.height * 0.92);
      document.querySelectorAll('.modal').forEach(m=>{ m.style.maxHeight = h + 'px'; });
    }
    vp.addEventListener('resize', adjustModals);
    vp.addEventListener('scroll', adjustModals);
    adjustModals();
  }
  document.querySelectorAll('#entryForm input, #entryForm select, .cat-add-row input').forEach(inp=>{
    inp.addEventListener('focus', ()=>{
      setTimeout(()=> inp.scrollIntoView({block:'center', behavior:'smooth'}), 300);
    });
  });

  renderCatSelect();
  renderAll();
})();
</script>
</body>
</html>
