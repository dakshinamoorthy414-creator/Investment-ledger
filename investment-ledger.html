<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Invest Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Invest Ledger">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4F46E5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6FA;
    --ink:#12131A;
    --ink-soft:#6B7280;
    --card:#FFFFFF;
    --line:#E5E7EB;
    --accent:#4F46E5;
    --accent-soft:rgba(79,70,229,0.10);
    --up:#16A34A;
    --down:#DC2626;
    --shadow:0 1px 2px rgba(16,17,26,0.05), 0 10px 26px rgba(16,17,26,0.05);
  }
  [data-theme="dark"]{
    --bg:#0E0F14;
    --ink:#F2F3F7;
    --ink-soft:#8B8FA3;
    --card:#181A22;
    --line:#272A35;
    --accent:#8B85F2;
    --accent-soft:rgba(139,133,242,0.16);
    --up:#4ADE80;
    --down:#F87171;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 26px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:calc(104px + env(safe-area-inset-bottom));
    transition:background 0.25s, color 0.25s;
  }
  .display{ font-family:'Space Grotesk', 'Inter', sans-serif; }
  .mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }

  header{
    padding:max(26px, env(safe-area-inset-top) + 16px) max(20px, env(safe-area-inset-right) + 20px) 10px max(20px, env(safe-area-inset-left) + 20px);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .wordmark{ display:flex; align-items:center; gap:8px; }
  .wordmark .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .wordmark span{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; letter-spacing:-0.01em; }
  .header-row{ display:flex; align-items:center; gap:6px; }
  .icon-btn{
    width:38px;height:38px;
    border-radius:10px;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    cursor:pointer;
    border:none;
    color:var(--ink-soft);
  }
  .icon-btn:active{ background:var(--line); }

  .hero{ padding:14px 20px 0; }
  .hero-label{ font-size:13px; color:var(--ink-soft); margin-bottom:4px; }
  .hero-amount{ font-size:42px; font-weight:600; letter-spacing:-0.01em; line-height:1.1; }
  .sub-row{ display:flex; align-items:baseline; gap:10px; margin-top:14px; }
  .sub-label{ font-size:12px; color:var(--ink-soft); }
  .sub-value{ font-size:16px; font-weight:600; }
  .sub-delta{ font-size:12px; font-weight:600; }
  .sub-delta.up{ color:var(--up); }
  .sub-delta.down{ color:var(--down); }
  .sub-delta.flat{ color:var(--ink-soft); }

  .alloc-wrap{ padding:22px 20px 18px; }
  .alloc-bar{
    display:flex;
    width:100%;
    height:9px;
    border-radius:5px;
    overflow:hidden;
    background:var(--line);
  }
  .alloc-bar.empty{ background:var(--line); }
  .alloc-seg{ height:100%; }
  .alloc-seg + .alloc-seg{ border-left:2px solid var(--bg); }

  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:13px; }
  .legend-dot{ width:8px;height:8px;border-radius:2px; flex-shrink:0; }
  .legend-name{ color:var(--ink-soft); }
  .legend-pct{ font-weight:600; color:var(--ink); }
  .empty-note{ font-size:13px; color:var(--ink-soft); }

  .divider{ border:none; border-top:1px solid var(--line); margin:4px 20px 0; }

  .section-heading{
    padding:20px 20px 4px;
    font-size:14px;
    font-weight:600;
    display:flex; justify-content:space-between; align-items:center;
  }
  .view-all{ font-size:12px; color:var(--accent); font-weight:600; cursor:pointer; }

  .port-list{ margin:0 20px; }
  .entry{
    display:flex; align-items:center; gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .port-list .entry:last-child{ border-bottom:none; }
  .entry-icon{
    width:34px;height:34px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px; flex-shrink:0;
  }
  .entry-info{ flex:1; min-width:0; }
  .entry-cat{ font-size:14.5px; font-weight:600; }
  .entry-note{ font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-date{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .entry-amt{ font-size:15px; font-weight:600; white-space:nowrap; }

  .no-entries{
    margin:0;
    text-align:center; color:var(--ink-soft); font-size:13px; padding:28px 10px;
    background:var(--card); border:1px dashed var(--line); border-radius:14px;
  }

  .fab{
    position:fixed;
    bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:30px;
    padding:14px 28px;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    box-shadow:0 8px 22px rgba(79,70,229,0.35);
    cursor:pointer;
  }

  input[type=file]{ display:none; }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,10,16,0.45);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--bg);
    width:100%; max-width:480px;
    max-height:85vh; overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 24px rgba(0,0,0,0.18);
    animation:slideUp 0.22s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(26px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal h3{ margin:0 0 16px; font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-size:16px; line-height:1.3; font-family:'Inter',sans-serif;
    -webkit-appearance:none; appearance:none; display:block;
  }
  .field select{ -webkit-appearance:menulist; appearance:auto; }
  .field input:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .cat-add-row{ display:flex; gap:8px; }
  .cat-add-row input{
    flex:1; padding:11px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    font-size:16px; line-height:1.3; font-family:'Inter',sans-serif;
    -webkit-appearance:none; appearance:none;
  }
  .modal-btns{ display:flex; gap:10px; margin-top:6px; }
  .btn{ flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:var(--card); color:var(--ink); border:1px solid var(--line); }

  .month-group{ margin:0 20px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .month-header{ font-size:13px; font-weight:600; padding:13px 14px; display:flex; justify-content:space-between; cursor:pointer; }
  .month-total{ color:var(--ink-soft); font-weight:500; }
  .month-body{ display:none; padding:0 12px 12px; flex-direction:column; gap:0; }
  .month-body.open{ display:flex; }
  .month-body .entry{ margin:0; }

  .toast{
    position:fixed; bottom:calc(94px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:.85rem;
    display:flex; gap:14px; align-items:center; z-index:60; box-shadow:0 4px 16px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; pointer-events:auto; }
  .toast button{ background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-family:inherit; }

  .hist-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; padding:9px 0; border-bottom:1px solid var(--line);
  }
  .hist-row:last-child{ border-bottom:none; }
  .hist-row .h-date{ color:var(--ink-soft); }
  .hist-row .h-amt{ font-weight:600; }
  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<header>
  <div class="wordmark"><span class="dot"></span><span>Invest Ledger</span></div>
  <div class="header-row">
    <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
    <button class="icon-btn" id="menuBtn" title="Menu">⋯</button>
  </div>
</header>

<div class="hero">
  <div class="hero-label">Total invested</div>
  <div class="hero-amount display mono" id="totalAmount">₹0</div>
  <div class="sub-row">
    <span class="sub-label">This month</span>
    <span class="sub-value mono" id="monthAmount">₹0</span>
    <span class="sub-delta flat" id="monthDelta"></span>
  </div>
</div>

<div class="alloc-wrap" id="chartCard">
  <div id="donutWrap"></div>
  <div class="legend" id="legend"></div>
</div>

<hr class="divider">

<div class="section-heading">
  <span>Portfolio</span>
  <span class="view-all" id="viewAllBtn" style="display:none;">Full history →</span>
</div>
<div class="port-list" id="recentList"></div>

<button class="fab" id="addBtn">＋ Add investment</button>
<input type="file" id="importFile" accept="application/json">

<!-- Entry detail overlay -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      <div class="entry-icon" id="detailIcon" style="width:46px;height:46px;font-size:21px;border-radius:12px;"></div>
      <div>
        <h3 id="detailCategory" style="margin:0;">Category</h3>
        <div id="detailDate" style="font-size:12px;color:var(--ink-soft);"></div>
      </div>
    </div>
    <div class="field">
      <label>Amount invested</label>
      <div id="detailAmount" class="display mono" style="font-size:28px;font-weight:600;"></div>
    </div>
    <div class="field" id="detailNoteField" style="display:none;">
      <label>Note</label>
      <div id="detailNote" style="font-size:14px;"></div>
    </div>
    <div class="field" id="detailHistoryField" style="display:none;">
      <label>Investment history</label>
      <div id="detailHistory"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="closeDetail">Close</button>
      <button class="btn btn-primary" id="editFromDetail">Edit</button>
    </div>
  </div>
</div>

<!-- Add / Edit entry modal -->
<div class="modal-overlay" id="addOverlay">
  <div class="modal">
    <h3 id="addModalTitle">Add investment</h3>
    <div id="addModalSubtitle" style="font-size:12px;color:var(--ink-soft);margin:-10px 0 14px;display:none;"></div>
    <form id="entryForm">
      <div class="row2">
        <div class="field">
          <label for="f-date">Date</label>
          <input type="date" id="f-date" required>
        </div>
        <div class="field">
          <label for="f-amount">Amount (₹)</label>
          <input type="number" id="f-amount" inputmode="decimal" step="0.01" min="0" placeholder="0" required>
        </div>
      </div>
      <div class="field">
        <label for="f-category">Category</label>
        <select id="f-category" required></select>
      </div>
      <div class="field" id="newCatField" style="display:none;">
        <label for="f-newcat">New category name</label>
        <div class="cat-add-row">
          <input type="text" id="f-newcat" placeholder="e.g. Gold ETF">
          <button type="button" class="btn btn-secondary" id="confirmNewCat" style="flex:0 0 auto;padding:11px 14px;">Add</button>
        </div>
      </div>
      <div class="field">
        <label for="f-note">Note (optional)</label>
        <input type="text" id="f-note" placeholder="e.g. SIP, lump sum, folio no.">
      </div>
      <div class="modal-btns">
        <button type="button" class="btn btn-secondary" id="deleteEntryBtn" style="display:none;color:var(--down);">Delete</button>
        <button type="button" class="btn btn-secondary" id="cancelAdd">Cancel</button>
        <button type="submit" class="btn btn-primary">Save entry</button>
      </div>
    </form>
  </div>
</div>

<!-- History overlay -->
<div class="modal-overlay" id="historyOverlay">
  <div class="modal">
    <h3>Full history</h3>
    <div id="monthGroupsInner"></div>
    <div class="modal-btns"><button class="btn btn-secondary" id="closeHistory">Close</button></div>
  </div>
</div>

<!-- Backup/menu overlay -->
<div class="modal-overlay" id="menuOverlay">
  <div class="modal">
    <h3>Data</h3>
    <div class="modal-btns" style="flex-direction:column;">
      <button class="btn btn-secondary" id="exportBtn">Export backup</button>
      <button class="btn btn-secondary" id="importBtn">Import backup</button>
      <button class="btn btn-secondary" id="manageCatBtn">Manage categories</button>
    </div>
    <div class="modal-btns"><button class="btn btn-secondary" id="closeMenu">Close</button></div>
  </div>
</div>

<!-- Manage categories overlay -->
<div class="modal-overlay" id="catOverlay">
  <div class="modal">
    <h3>Categories</h3>
    <div id="catList" style="margin-bottom:14px;"></div>
    <div class="cat-add-row" style="margin-bottom:14px;">
      <input type="text" id="inCatName" placeholder="New category name">
      <button type="button" class="btn btn-secondary" id="addCatBtn" style="flex:0 0 auto;padding:11px 14px;">Add</button>
    </div>
    <div class="modal-btns"><button class="btn btn-secondary" id="closeCat">Close</button></div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastMsg"></span>
  <button id="toastUndo">Undo</button>
</div>

<script>
(function(){
  const LS_ENTRIES = 'ledger_investment_entries_v1';
  const LS_CATS = 'ledger_investment_categories_v1';
  const LS_THEME = 'ledger_investment_theme_v1';

  const DEFAULT_CATS = [
    { name:'Zerodha', icon:'📈', color:'#4F46E5' },
    { name:'Mutual Fund', icon:'🌱', color:'#0EA5A4' },
    { name:'US Stock', icon:'🌎', color:'#DC6B19' },
    { name:'Bond', icon:'📜', color:'#CA8A04' }
  ];
  const PALETTE = ['#4F46E5','#0EA5A4','#DC6B19','#CA8A04','#7C3AED','#059669','#E11D48','#2563EB'];

  let entries = JSON.parse(localStorage.getItem(LS_ENTRIES) || '[]');
  let categories = JSON.parse(localStorage.getItem(LS_CATS) || 'null') || DEFAULT_CATS.slice();
  let pendingDelete = null;
  let editingId = null;
  let viewingId = null;
  let undoTimer = null;

  function save(){
    localStorage.setItem(LS_ENTRIES, JSON.stringify(entries));
    localStorage.setItem(LS_CATS, JSON.stringify(categories));
  }
  function fmt(n){ return '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:0}); }
  function catInfo(name){
    return categories.find(c=>c.name===name) || { name, icon:'💰', color: PALETTE[categories.length % PALETTE.length] };
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
    localStorage.setItem(LS_THEME, t);
  }
  applyTheme(localStorage.getItem(LS_THEME) || 'light');
  themeToggle.addEventListener('click', ()=>{
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  function openOverlay(id){ document.getElementById(id).classList.add('show'); }
  function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }

  const catSelect = document.getElementById('f-category');
  const newCatField = document.getElementById('newCatField');
  function renderCatSelect(){
    catSelect.innerHTML = '';
    categories.forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.icon + ' ' + c.name;
      catSelect.appendChild(opt);
    });
    const addOpt = document.createElement('option');
    addOpt.value = '__add__';
    addOpt.textContent = '＋ Add new category';
    catSelect.appendChild(addOpt);
  }
  catSelect.addEventListener('change', ()=>{
    newCatField.style.display = catSelect.value === '__add__' ? 'block' : 'none';
  });
  document.getElementById('confirmNewCat').addEventListener('click', ()=>{
    const val = document.getElementById('f-newcat').value.trim();
    if(!val) return;
    if(!categories.find(c=>c.name.toLowerCase()===val.toLowerCase())){
      categories.push({name:val, icon:'💰', color: PALETTE[categories.length % PALETTE.length]});
      save();
    }
    renderCatSelect();
    catSelect.value = val;
    newCatField.style.display = 'none';
    document.getElementById('f-newcat').value = '';
  });

  document.getElementById('addBtn').addEventListener('click', ()=>{
    editingId = null;
    document.getElementById('addModalTitle').textContent = 'Add investment';
    document.getElementById('addModalSubtitle').style.display = 'none';
    document.getElementById('deleteEntryBtn').style.display = 'none';
    document.getElementById('entryForm').reset();
    document.getElementById('f-date').valueAsDate = new Date();
    renderCatSelect();
    newCatField.style.display = 'none';
    openOverlay('addOverlay');
  });
  document.getElementById('cancelAdd').addEventListener('click', ()=> closeOverlay('addOverlay'));

  function openEditModal(id){
    const entry = entries.find(en=>en.id===id);
    if(!entry) return;
    editingId = id;
    const dateLabel = new Date(entry.date+'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
    document.getElementById('addModalTitle').textContent = entry.category;
    const sub = document.getElementById('addModalSubtitle');
    sub.textContent = 'Invested on ' + dateLabel;
    sub.style.display = 'block';
    document.getElementById('deleteEntryBtn').style.display = 'block';
    renderCatSelect();
    newCatField.style.display = 'none';
    document.getElementById('f-date').value = entry.date;
    document.getElementById('f-amount').value = entry.amount;
    catSelect.value = entry.category;
    document.getElementById('f-note').value = entry.note || '';
    openOverlay('addOverlay');
  }

  document.getElementById('deleteEntryBtn').addEventListener('click', ()=>{
    if(!editingId) return;
    closeOverlay('addOverlay');
    confirmDelete(editingId);
    editingId = null;
  });

  document.getElementById('entryForm').addEventListener('submit', e=>{
    e.preventDefault();
    const date = document.getElementById('f-date').value;
    const amount = parseFloat(document.getElementById('f-amount').value);
    let category = catSelect.value;
    const note = document.getElementById('f-note').value.trim();
    if(category === '__add__'){
      const val = document.getElementById('f-newcat').value.trim();
      if(!val) return;
      if(!categories.find(c=>c.name.toLowerCase()===val.toLowerCase())){
        categories.push({name:val, icon:'💰', color: PALETTE[categories.length % PALETTE.length]});
      }
      category = val;
    }
    if(!date || !amount || !category) return;

    if(editingId){
      const entry = entries.find(en=>en.id===editingId);
      if(entry){
        entry.date = date;
        entry.amount = amount;
        entry.category = category;
        entry.note = note;
        entry.history = [{date, amount, note}];
      }
      editingId = null;
    } else {
      const existing = entries.find(e=>e.category.toLowerCase()===category.toLowerCase());
      if(existing){
        if(!existing.history) existing.history = [{date: existing.date, amount: existing.amount, note: existing.note}];
        existing.history.push({date, amount, note});
        existing.amount += amount;
        if(date >= existing.date) existing.date = date;
        if(note){
          existing.note = existing.note ? existing.note + ' · ' + note : note;
        }
      } else {
        entries.push({id:uid(), date, amount, category, note, history:[{date, amount, note}]});
      }
    }
    save();
    e.target.reset();
    renderCatSelect();
    newCatField.style.display = 'none';
    closeOverlay('addOverlay');
    renderAll();
  });

  function renderTotal(){
    const total = entries.reduce((s,e)=>s+e.amount,0);
    document.getElementById('totalAmount').textContent = fmt(total);

    const now = new Date();
    const thisKey = now.toISOString().slice(0,7);
    const lastDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    const lastKey = lastDate.toISOString().slice(0,7);
    const thisMonthTotal = entries.filter(e=>e.date.slice(0,7)===thisKey).reduce((s,e)=>s+e.amount,0);
    const lastMonthTotal = entries.filter(e=>e.date.slice(0,7)===lastKey).reduce((s,e)=>s+e.amount,0);

    document.getElementById('monthAmount').textContent = fmt(thisMonthTotal);
    const deltaEl = document.getElementById('monthDelta');
    if(lastMonthTotal === 0){
      deltaEl.textContent = thisMonthTotal > 0 ? 'New this month' : '';
      deltaEl.className = 'delta flat';
    } else {
      const pct = Math.round(((thisMonthTotal - lastMonthTotal) / lastMonthTotal) * 100);
      if(pct === 0){
        deltaEl.textContent = 'Same as last month';
        deltaEl.className = 'delta flat';
      } else if(pct > 0){
        deltaEl.textContent = '↑ ' + pct + '% vs last month';
        deltaEl.className = 'delta up';
      } else {
        deltaEl.textContent = '↓ ' + Math.abs(pct) + '% vs last month';
        deltaEl.className = 'delta down';
      }
    }
  }

  function renderChart(){
    const wrap = document.getElementById('donutWrap');
    const legend = document.getElementById('legend');
    const totals = {};
    entries.forEach(e=>{ totals[e.category] = (totals[e.category]||0) + e.amount; });
    const cats = Object.keys(totals);
    if(cats.length === 0){
      wrap.innerHTML = '<div class="alloc-bar empty"></div>';
      legend.innerHTML = '<div class="empty-note">Add your first investment to see the allocation here.</div>';
      return;
    }
    const grand = cats.reduce((s,c)=>s+totals[c],0);
    const sorted = cats.slice().sort((a,b)=>totals[b]-totals[a]);
    const segs = sorted.map(c=>{
      const info = catInfo(c);
      const pct = (totals[c]/grand)*100;
      return `<div class="alloc-seg" style="width:${pct}%;background:${info.color}"></div>`;
    }).join('');
    wrap.innerHTML = `<div class="alloc-bar">${segs}</div>`;
    legend.innerHTML = sorted.map(c=>{
      const info = catInfo(c);
      const pct = Math.round((totals[c]/grand)*100);
      return `<div class="legend-item">
        <span class="legend-dot" style="background:${info.color}"></span>
        <span class="legend-name">${info.icon} ${c}</span>
        <span class="legend-pct mono">${pct}%</span>
      </div>`;
    }).join('');
  }

  function entryRowHTML(e){
    const info = catInfo(e.category);
    const dateStr = new Date(e.date+'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short'});
    return `<div class="entry" data-id="${e.id}">
      <div class="entry-icon" style="background:${info.color}22;color:${info.color}">${info.icon}</div>
      <div class="entry-info">
        <div class="entry-cat">${e.category}</div>
        <div class="entry-date">${dateStr}${e.note ? ' · <span class="entry-note">'+escapeHtml(e.note)+'</span>' : ''}</div>
      </div>
      <div class="entry-amt mono">${fmt(e.amount)}</div>
    </div>`;
  }

  function renderRecent(){
    const list = document.getElementById('recentList');
    const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
    const recent = sorted.slice(0,5);
    if(recent.length === 0){
      list.innerHTML = '<div class="no-entries">No investments logged yet. Tap "Add investment" to start.</div>';
      document.getElementById('viewAllBtn').style.display = 'none';
      return;
    }
    list.innerHTML = recent.map(e=>entryRowHTML(e)).join('');
    attachRowHandlers(list);
    document.getElementById('viewAllBtn').style.display = entries.length > 5 ? 'inline' : 'none';
  }

  function attachRowHandlers(container){
    container.querySelectorAll('.entry').forEach(row=>{
      let startX = 0, delta = 0;
      row.addEventListener('touchstart', ev=>{ startX = ev.touches[0].clientX; }, {passive:true});
      row.addEventListener('touchmove', ev=>{ delta = ev.touches[0].clientX - startX; }, {passive:true});
      row.addEventListener('touchend', ()=>{
        if(delta < -50) confirmDelete(row.getAttribute('data-id'));
        delta = 0;
      });
      row.addEventListener('click', ()=> openDetailModal(row.getAttribute('data-id')));
    });
  }

  function openDetailModal(id){
    const entry = entries.find(en=>en.id===id);
    if(!entry) return;
    viewingId = id;
    const info = catInfo(entry.category);
    const dateLabel = new Date(entry.date+'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
    document.getElementById('detailIcon').style.background = info.color + '22';
    document.getElementById('detailIcon').style.color = info.color;
    document.getElementById('detailIcon').textContent = info.icon;
    document.getElementById('detailCategory').textContent = entry.category;
    document.getElementById('detailDate').textContent = 'Invested on ' + dateLabel;
    document.getElementById('detailAmount').textContent = fmt(entry.amount);
    const noteField = document.getElementById('detailNoteField');
    if(entry.note){
      noteField.style.display = 'block';
      document.getElementById('detailNote').textContent = entry.note;
    } else {
      noteField.style.display = 'none';
    }
    const histField = document.getElementById('detailHistoryField');
    const histWrap = document.getElementById('detailHistory');
    if(entry.history && entry.history.length > 1){
      histField.style.display = 'block';
      const sorted = [...entry.history].sort((a,b)=> b.date.localeCompare(a.date));
      histWrap.innerHTML = sorted.map(h=>{
        const dl = new Date(h.date+'T00:00:00').toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
        return `<div class="hist-row"><span class="h-date">${dl}${h.note ? ' · '+escapeHtml(h.note) : ''}</span><span class="h-amt mono">${fmt(h.amount)}</span></div>`;
      }).join('');
    } else {
      histField.style.display = 'none';
      histWrap.innerHTML = '';
    }
    openOverlay('detailOverlay');
  }
  document.getElementById('closeDetail').addEventListener('click', ()=> closeOverlay('detailOverlay'));
  document.getElementById('detailOverlay').addEventListener('click', e=>{ if(e.target.id==='detailOverlay') closeOverlay('detailOverlay'); });
  document.getElementById('editFromDetail').addEventListener('click', ()=>{
    closeOverlay('detailOverlay');
    if(viewingId) openEditModal(viewingId);
  });

  function confirmDelete(id){
    const idx = entries.findIndex(e=>e.id===id);
    if(idx === -1) return;
    pendingDelete = entries[idx];
    entries.splice(idx,1);
    save();
    renderAll();
    showToast('Entry deleted');
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(()=>{ toast.classList.remove('show'); pendingDelete = null; }, 4000);
  }
  document.getElementById('toastUndo').addEventListener('click', ()=>{
    if(pendingDelete){ entries.push(pendingDelete); pendingDelete = null; save(); renderAll(); }
    document.getElementById('toast').classList.remove('show');
    clearTimeout(undoTimer);
  });

  function renderMonthGroups(){
    const container = document.getElementById('monthGroupsInner');
    if(entries.length === 0){
      container.innerHTML = '<div class="no-entries" style="margin:0;">No investments logged yet.</div>';
      return;
    }
    const groups = {};
    entries.forEach(e=>{
      const key = e.date.slice(0,7);
      groups[key] = groups[key] || [];
      groups[key].push(e);
    });
    const keys = Object.keys(groups).sort().reverse();
    container.innerHTML = keys.map(key=>{
      const list = groups[key].sort((a,b)=> b.date.localeCompare(a.date));
      const total = list.reduce((s,e)=>s+e.amount,0);
      const label = new Date(key+'-01T00:00:00').toLocaleDateString('en-IN', {month:'long', year:'numeric'});
      return `<div class="month-group">
        <div class="month-header" data-key="${key}">
          <span>${label}</span>
          <span class="month-total mono">${fmt(total)}</span>
        </div>
        <div class="month-body" id="mb-${key}">${list.map(e=>entryRowHTML(e)).join('')}</div>
      </div>`;
    }).join('');
    container.querySelectorAll('.month-header').forEach(h=>{
      h.addEventListener('click', ()=>{
        document.getElementById('mb-' + h.getAttribute('data-key')).classList.toggle('open');
      });
    });
    attachRowHandlers(container);
  }

  function renderCatManage(){
    const list = document.getElementById('catList');
    list.innerHTML = categories.map((c,i)=>{
      const used = entries.some(e=>e.category===c.name);
      return `<div class="entry" style="margin:0;">
        <div class="entry-icon" style="background:${c.color}22;color:${c.color}">${c.icon}</div>
        <div class="entry-info"><div class="entry-cat">${c.name}</div></div>
        ${used ? '<span style="font-size:.72rem;color:var(--ink-soft)">in use</span>' : `<button class="icon-btn" data-del="${i}" style="width:28px;height:28px;font-size:.75rem;">✕</button>`}
      </div>`;
    }).join('');
    list.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        categories.splice(parseInt(btn.getAttribute('data-del')),1);
        save();
        renderCatManage();
        renderCatSelect();
      });
    });
  }
  document.getElementById('addCatBtn').addEventListener('click', ()=>{
    const val = document.getElementById('inCatName').value.trim();
    if(!val) return;
    if(!categories.find(c=>c.name.toLowerCase()===val.toLowerCase())){
      categories.push({name:val, icon:'💰', color: PALETTE[categories.length % PALETTE.length]});
      save();
    }
    document.getElementById('inCatName').value = '';
    renderCatManage();
    renderCatSelect();
  });

  function renderAll(){
    renderTotal();
    renderChart();
    renderRecent();
  }

  document.getElementById('viewAllBtn').addEventListener('click', ()=>{ renderMonthGroups(); openOverlay('historyOverlay'); });
  document.getElementById('closeHistory').addEventListener('click', ()=> closeOverlay('historyOverlay'));
  document.getElementById('historyOverlay').addEventListener('click', e=>{ if(e.target.id==='historyOverlay') closeOverlay('historyOverlay'); });

  document.getElementById('menuBtn').addEventListener('click', ()=> openOverlay('menuOverlay'));
  document.getElementById('closeMenu').addEventListener('click', ()=> closeOverlay('menuOverlay'));
  document.getElementById('menuOverlay').addEventListener('click', e=>{ if(e.target.id==='menuOverlay') closeOverlay('menuOverlay'); });

  document.getElementById('manageCatBtn').addEventListener('click', ()=>{ closeOverlay('menuOverlay'); renderCatManage(); openOverlay('catOverlay'); });
  document.getElementById('closeCat').addEventListener('click', ()=> closeOverlay('catOverlay'));
  document.getElementById('catOverlay').addEventListener('click', e=>{ if(e.target.id==='catOverlay') closeOverlay('catOverlay'); });

  document.getElementById('addOverlay').addEventListener('click', e=>{ if(e.target.id==='addOverlay') closeOverlay('addOverlay'); });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const data = {entries, categories, exportedAt:new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'investment-ledger-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', ev=>{
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(Array.isArray(data.entries)) entries = data.entries;
        if(Array.isArray(data.categories)) categories = data.categories;
        save();
        renderCatSelect();
        renderAll();
        showToast('Backup imported');
      }catch(err){
        showToast('Import failed — invalid file');
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  });

  // Keep modals and focused fields visible above the iOS keyboard
  if (window.visualViewport) {
    const vp = window.visualViewport;
    function adjustModals(){
      const h = Math.round(vp.height * 0.92);
      document.querySelectorAll('.modal').forEach(m=>{ m.style.maxHeight = h + 'px'; });
    }
    vp.addEventListener('resize', adjustModals);
    vp.addEventListener('scroll', adjustModals);
    adjustModals();
  }
  document.querySelectorAll('#entryForm input, #entryForm select, .cat-add-row input').forEach(inp=>{
    inp.addEventListener('focus', ()=>{
      setTimeout(()=> inp.scrollIntoView({block:'center', behavior:'smooth'}), 300);
    });
  });

  renderCatSelect();
  renderAll();
})();
</script>
</body>
</html>
